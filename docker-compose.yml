version : '3.8'

services:
  db:
    image: mysql:8.0
    container_name: matchit_mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  backend:
    build: ./backend
    container_name: matchit_backend
    restart: always
    ports:
      - "5100:5100"
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
  frontend:
    build: ./frontend
    container_name: matchit_frontend
    restart: always
    ports:
     - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
  
volumes:
  db_data: